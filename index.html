<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0A2B60">
<title>Orçamento GoBanners</title>
<link rel="icon" type="image/png" href="https://gobanners.com.br/wp-content/uploads/2023/11/Favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&display=swap">
<style>
  :root {
    /* identidade da GoBanners (cores do site gobanners.com.br) */
    --navy: #0A2B60;
    --navy-2: #071E43;
    --blue: #0A2B60;
    --coral: #ED2B2F;
    --green: #14A154;
    --yellow: #F5B400;
    --bg: #FFFFFF;
    --surface: #FFFFFF;
    --surface-2: #F0F4F9;
    --line: #DCE4EE;
    --text: #010F1C;
    --muted: #4A6279;
    --bot-bubble: #FFFFFF;
    --bot-text: #010F1C;
    --user-bubble: #0A2B60;
    --user-text: #FFFFFF;
    --input-bg: #FFFFFF;
    --focus: #0A2B60;
    --wall: #F0F4F9;
    --wall-dot: #D9E2EE;
    --shadow: 0 1px 2px rgba(10,43,96,.06), 0 6px 20px rgba(10,43,96,.07);
    --font-display: "Baloo 2", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    --font-body: "Baloo 2", -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  :root { color-scheme: light; }

  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 17px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  * { box-sizing: border-box; }
  button { font: inherit; }

  .app {
    height: 100%;
    display: flex;
    flex-direction: column;
    max-width: 760px;
    margin: 0 auto;
    background: var(--bg);
  }

  /* ---------- Top bar ---------- */
  .topbar {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 5;
    background: var(--surface);
    color: var(--text);
    border-bottom: 1px solid var(--line);
  }
  .topbar-row {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 16px;
  }
  .brand {
    display: flex; align-items: center; gap: 10px;
    flex: 1 1 auto; min-width: 0;
  }
  .brand img { width: 46px; height: 46px; display: block; flex: none; object-fit: contain; }
  .brand .t1 {
    font-family: var(--font-display); font-weight: 700; font-size: 18px; line-height: 1.1;
    color: var(--text);
  }
  .brand .t2 { font-size: 13px; color: var(--muted); line-height: 1.2; font-weight: 500; }
  .stepinfo {
    font-size: 13px; color: var(--muted); font-weight: 600;
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .stepinfo b { color: var(--blue); font-weight: 700; }
  .fora-exp { display: block; margin-top: 10px; padding: 9px 12px; border-radius: 12px; background: #FFF6DB; border: 1px solid #F5D98B; color: #5B4300; font-size: .95em; line-height: 1.45; }
  .stepinfo[hidden] { display: none; }
  @media (max-width: 430px) {
    .brand .t1 { font-size: 16px; }
    .brand .t2 { font-size: 12px; }
    .brand img { width: 40px; height: 40px; }
    .stepinfo { font-size: 12px; }
    .topbar-row { gap: 8px; padding: 8px 12px; }
  }
  /* ---------- Prova social (avaliações) ---------- */
  .proof {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px 8px;
    padding: 8px 12px; background: var(--surface); border-bottom: 1px solid var(--line);
    font-size: 12.5px; color: var(--muted); font-weight: 500; line-height: 1.2;
  }
  .proof .pill {
    display: inline-flex; align-items: center; gap: 5px;
    background: var(--surface-2); border-radius: 999px; padding: 4px 10px; white-space: nowrap;
  }
  .proof .pill.google { background: #FFF6DE; }
  .proof .stars { color: var(--yellow); letter-spacing: -1px; font-size: 13px; }
  .proof b { color: var(--text); font-weight: 700; }
  @media (max-width: 380px) { .proof { font-size: 11.5px; gap: 4px 6px; } .proof .pill { padding: 3px 8px; } }

  .track { height: 4px; background: var(--surface-2); }
  .track .fill {
    height: 100%; width: 0;
    background: var(--yellow);
    transition: width .35s ease;
  }
  @media (prefers-reduced-motion: reduce) { .track .fill { transition: none; } }

  /* ---------- Chat ---------- */
  .chat {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 20px 16px 12px;
    background-color: var(--wall);
    background-image: radial-gradient(var(--wall-dot) 1px, transparent 1.2px);
    background-size: 18px 18px;
    display: flex; flex-direction: column; gap: 10px;
    scroll-behavior: smooth;
  }
  @media (prefers-reduced-motion: reduce) { .chat { scroll-behavior: auto; } }

  .row { display: flex; gap: 10px; align-items: flex-start; max-width: 100%; }
  .row.bot { justify-content: flex-start; }
  .row.user { justify-content: flex-end; }
  .avatar {
    width: 44px; height: 44px; border-radius: 50%; flex: none;
    background: var(--surface); color: #fff; border: 1px solid var(--line);
    display: grid; place-items: center; overflow: hidden;
    box-shadow: var(--shadow);
  }
  .avatar img { width: 32px; height: 32px; object-fit: contain; }
  .avatar.foto img { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; }
  .brand img.foto { border-radius: 50%; object-fit: cover; border: 2px solid var(--yellow); }

  .bubble {
    position: relative;
    max-width: min(80%, 560px);
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.5;
    box-shadow: var(--shadow);
    animation: pop .22s ease-out;
    overflow-wrap: anywhere;
  }
  @media (prefers-reduced-motion: reduce) { .bubble { animation: none; } }
  @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .row.bot .bubble { background: var(--bot-bubble); color: var(--bot-text); border-top-left-radius: 4px; }
  .row.user .bubble { background: var(--user-bubble); color: var(--user-text); border-top-right-radius: 4px; font-weight: 500; }
  .row.bot .bubble::before, .row.user .bubble::before {
    content: ''; position: absolute; top: 0; width: 0; height: 0;
    border-style: solid;
  }
  .row.bot .bubble::before { left: -8px; border-width: 0 8px 10px 0; border-color: transparent var(--bot-bubble) transparent transparent; }
  .row.user .bubble::before { right: -8px; border-width: 0 0 10px 8px; border-color: transparent transparent transparent var(--user-bubble); }
  .bubble b { font-weight: 700; }

  .typing { display: inline-flex; gap: 4px; padding: 4px 2px; }
  .typing i {
    width: 7px; height: 7px; border-radius: 50%; background: var(--muted); opacity: .5;
    animation: blink 1s infinite;
  }
  .typing i:nth-child(2) { animation-delay: .15s; }
  .typing i:nth-child(3) { animation-delay: .3s; }
  @keyframes blink { 0%,100% { opacity: .25; } 50% { opacity: .9; } }

  /* ---------- Summary card ---------- */
  .card {
    align-self: stretch;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    overflow: hidden;
    margin: 6px 0 4px 46px;
    box-shadow: var(--shadow);
  }
  @media (max-width: 480px) { .card { margin-left: 0; } }
  .card-head {
    background: var(--navy); color: #fff;
    padding: 12px 16px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .card-head h3 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 18px; line-height: 1.2; color: #fff; }
  .card-head span { font-size: 12px; opacity: .85; }
  .pill {
    display: inline-block; padding: 3px 10px; border-radius: 999px;
    font-size: 12px; font-weight: 600; letter-spacing: .3px;
    background: var(--yellow); color: #17171D;
  }
  .pill.p4 { background: var(--surface-2); color: var(--text); }
  .card dl {
    margin: 0; padding: 12px 16px;
    display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px;
    font-size: 14px;
  }
  .card dt { color: var(--muted); font-weight: 500; }
  .card dd { margin: 0; font-weight: 500; overflow-wrap: anywhere; }
  .card .signals {
    border-top: 1px solid var(--line);
    padding: 12px 16px; font-size: 13px; color: var(--muted);
  }
  .card .signals b { color: var(--text); font-weight: 600; }
  .card .signals ul { margin: 6px 0 0; padding-left: 18px; }
  .card .signals li { margin: 2px 0; }

  /* ---------- Dock (input area) ---------- */
  .dock {
    flex: none;
    padding: 10px 16px calc(12px + env(safe-area-inset-bottom, 0px));
    background: var(--bg);
    border-top: 1px solid var(--line);
  }
  .dock-inner { display: flex; flex-direction: column; gap: 8px; }
  .label {
    font-size: 13px; font-weight: 600; color: var(--muted);
    padding-left: 4px;
  }
  .field {
    display: flex; align-items: center; gap: 10px;
  }
  .inpwrap {
    flex: 1 1 auto; min-width: 0;
    display: flex; align-items: center; gap: 8px;
    border: 2px solid var(--line);
    background: var(--input-bg);
    border-radius: 24px;
    padding: 0 18px;
    box-shadow: var(--shadow);
    transition: border-color .15s, box-shadow .15s;
  }
  .inpwrap:focus-within { border-color: var(--focus); box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 22%, transparent); }
  .inpwrap .prefix {
    flex: none; display: inline-flex; align-items: center; gap: 6px;
    font-weight: 600; color: var(--text); font-size: 16px;
    padding-right: 10px; border-right: 1px solid var(--line);
  }
  .inpwrap .prefix .flag { font-size: 20px; line-height: 1; }
  .ddi {
    flex: none; position: relative; display: inline-flex; align-items: center; gap: 4px;
    padding-right: 10px; border-right: 1px solid var(--line); cursor: pointer;
    font-weight: 600; color: var(--text); font-size: 16px; white-space: nowrap;
  }
  .ddi .flag { font-size: 20px; line-height: 1; }
  .ddi .chev { width: 14px; height: 14px; color: var(--muted); }
  .ddi select {
    position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer;
    font-size: 16px; /* evita zoom no iOS */
  }
  .ddi:focus-within { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 8px; }
  .inpwrap .wa { flex: none; width: 22px; height: 22px; color: #25D366; }
  .field input {
    flex: 1 1 auto; min-width: 0; width: 100%;
    border: 0; outline: 0; background: transparent;
    font: inherit; font-size: 17px; color: var(--text);
    padding: 13px 0;
  }
  .field input::placeholder { color: var(--muted); opacity: .8; }
  .send {
    flex: none; width: 50px; height: 50px; border-radius: 50%;
    border: 0; background: var(--coral); color: #fff;
    display: grid; place-items: center; cursor: pointer;
    box-shadow: 0 4px 12px rgba(229,57,53,.3);
    transition: transform .1s, opacity .15s, box-shadow .15s;
  }
  .send:hover { transform: scale(1.05); }
  .send:disabled { opacity: .35; cursor: default; transform: none; box-shadow: none; }
  .send:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .send svg { width: 22px; height: 22px; margin-left: 2px; }
  .hint { font-size: 12px; color: var(--muted); padding-left: 4px; min-height: 1.2em; }
  .hint.err { color: var(--coral); font-weight: 500; }

  .choices { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-start; }
  .row.quick { margin-top: -2px; }
  .row.quick .avatar.espaco { visibility: hidden; box-shadow: none; }
  .row.quick .choices { flex: 1 1 auto; }
  .choice {
    border: 2px solid var(--blue); background: var(--surface); color: var(--blue);
    border-radius: 999px; padding: 9px 18px; font-weight: 700; font-size: 15px;
    cursor: pointer; box-shadow: var(--shadow);
    transition: background .12s, color .12s, transform .1s;
  }
  .choice:hover { background: var(--blue); color: #fff; border-color: var(--blue); }
  .choice:active { transform: scale(.97); }
  .choice:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .choice.quiet { border-color: rgba(10, 43, 96, .35); color: var(--text); background: var(--surface); }
  .choice.quiet:hover { background: var(--surface-2); color: var(--text); }
  /* "corrigir a resposta anterior": discreto, mas legível (texto escuro, borda azul suave, tamanho menor) */
  .dock .choices { margin-top: 8px; }
  .dock .choice.quiet { color: var(--text); border-color: rgba(10, 43, 96, .35); font-size: 13.5px; padding: 7px 14px; font-weight: 600; }
  .dock .choice.quiet:hover { border-color: var(--blue); color: var(--blue); }

  .cta {
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    background: #25D366; color: #06281A; text-decoration: none;
    border-radius: 999px; padding: 14px 22px; font-weight: 600; font-size: 16px;
    box-shadow: var(--shadow);
  }
  .cta svg { width: 22px; height: 22px; }
  .cta.mail { background: var(--surface-2); color: var(--text); }
  .restart {
    background: none; border: 0; color: var(--muted); cursor: pointer;
    font-size: 13px; text-decoration: underline; padding: 6px;
  }
  .foot {
    font-size: 11px; color: var(--muted); text-align: center; line-height: 1.4;
  }
  .foot a { color: inherit; }
  .legal {
    display: flex; align-items: center; justify-content: center; gap: 5px;
    font-size: 11.5px; color: var(--muted); text-align: center; padding: 8px 4px 0; line-height: 1.3;
  }
  .legal svg { width: 12px; height: 12px; flex: none; }
  .legal a { color: var(--blue); font-weight: 600; }
  .legal a.outro { display: inline-block; margin-top: 6px; font-size: 13.5px; font-weight: 700; color: var(--blue); text-decoration: underline; text-underline-offset: 3px; padding: 4px 0; }
  .proto {
    font-size: 11px; color: var(--muted); text-align: center;
    padding: 6px 16px 0; letter-spacing: .04em;
  }

  /* ---------- Tela cheia por cima do site: o × do site fica no canto; abre espaço no cabeçalho ---------- */
  body.cheia .topbar-row { padding-right: 56px; }
  body.cheia .gear { display: none; }

  /* ---------- Modo embutido (iframe dentro do cartão do site) ---------- */
  body.embed .topbar-row { display: none; }
  body.embed .app { max-width: none; }
  body.embed .chat { padding: 14px 12px 10px; }
  body.embed .dock { padding: 8px 12px calc(10px + env(safe-area-inset-bottom, 0px)); }
  body.embed .proto { display: none; }
  .fechar {
    position: fixed; top: 8px; right: 8px; z-index: 20;
    width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line);
    background: var(--surface); color: var(--text); cursor: pointer; display: none;
    place-items: center; box-shadow: var(--shadow); font-size: 20px; line-height: 1;
  }
  body.embed.expandido .fechar { display: grid; }
  .proto code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px; }

  /* ---------- Painel de distribuição (protótipo) ---------- */
  .gear[hidden] { display: none; }
  .gear {
    background: var(--surface-2); border: 0; color: var(--muted); width: 36px; height: 36px;
    border-radius: 50%; display: grid; place-items: center; cursor: pointer; flex: none;
  }
  .gear:hover { color: var(--text); }
  .gear:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .gear svg { width: 20px; height: 20px; }
  .panel {
    position: fixed; inset: 0; z-index: 20;
    background: rgba(10,42,107,.45);
    display: flex; align-items: flex-end; justify-content: center;
    padding: 16px;
  }
  .panel-box {
    width: 100%; max-width: 520px;
    background: var(--surface); color: var(--text);
    border-radius: 18px; box-shadow: var(--shadow);
    padding: 18px 18px calc(18px + env(safe-area-inset-bottom, 0px));
    display: flex; flex-direction: column; gap: 14px;
  }
  .panel-box h2 { margin: 0; font-family: var(--font-display); font-size: 20px; font-weight: 700; line-height: 1.2; }
  .panel-box p { margin: 0; font-size: 13px; color: var(--muted); }
  .crow {
    display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 12px;
    padding: 10px 0; border-top: 1px solid var(--line);
  }
  .crow .nm { font-weight: 600; }
  .crow .ph { font-size: 12px; color: var(--muted); }
  .crow select { font: inherit; font-size: 14px; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--input-bg); color: var(--text); }
  .switch { position: relative; width: 48px; height: 28px; }
  .switch input { opacity: 0; width: 0; height: 0; position: absolute; }
  .switch span {
    position: absolute; inset: 0; border-radius: 999px; background: var(--line); cursor: pointer; transition: background .15s;
  }
  .switch span::after {
    content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%;
    background: #fff; transition: transform .15s; box-shadow: 0 1px 3px rgba(0,0,0,.3);
  }
  .switch input:checked + span { background: #25D366; }
  .switch input:checked + span::after { transform: translateX(20px); }
  .switch input:focus-visible + span { outline: 3px solid var(--focus); outline-offset: 2px; }
  .queue { font-size: 13px; color: var(--muted); }
  .queue b { color: var(--text); }
  .panel-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .btn {
    border-radius: 999px; padding: 10px 18px; font-weight: 700; font-size: 14px; cursor: pointer;
    border: 2px solid var(--blue); background: var(--blue); color: #fff;
  }
  .btn.ghost { background: transparent; color: var(--blue); }
  /* ---- GoBanners ---- */
  .brand { gap: 14px; }
  .brand img.logo { width: auto; height: 30px; border-radius: 0; }
  .brand .txt { padding-left: 14px; border-left: 1px solid var(--line); }
  .stepinfo b { color: var(--coral); }
  .track .fill { background: var(--coral); }
  .proof { background: var(--navy); border-bottom: 0; color: #DCE6F5; padding: 9px 12px; }
  .proof .pill { background: rgba(255,255,255,.10); color: #DCE6F5; }
  .proof .pill.google { background: #FFFFFF; color: var(--muted); }
  .proof .pill b { color: #FFFFFF; }
  .proof .pill.google b { color: var(--text); }
  .send { background: var(--green); box-shadow: 0 4px 12px rgba(20,161,84,.3); }
  .hint.err { color: var(--coral); }
  .avatar { border-color: var(--line); }
  .choice:hover { background: var(--navy); border-color: var(--navy); }
  @media (max-width: 520px) { .brand .txt { display: none; } .brand img.logo { height: 26px; } }
  .row.fim { margin-top: 2px; }
  .dock:has(.dock-inner:empty) .dock-inner { display: none; }
</style>
</head>
<body>

<div class="app">
  <header class="topbar">
    <div class="topbar-row">
      <div class="brand" aria-label="GoBanners">
        <img class="logo" src="https://gobanners.com.br/wp-content/uploads/2024/01/GoBanners-Logotipo-Horizontal.svg" alt="GoBanners">
        <div class="txt"><div class="t1">Solicitar orçamento</div><div class="t2">Leva menos de 1 minuto</div></div>
      </div>
      <div class="stepinfo" id="stepinfo">Passo <b><span id="stepNow">1</span></b> de <span id="stepTotal">6</span></div>
    </div>
    <div class="track" aria-hidden="true"><div class="fill" id="fill"></div></div>
    <div class="proof" aria-label="Sobre a GoBanners">
      <span class="pill google"><span class="stars" aria-hidden="true">★★★★★</span> <b>5.0</b> no <b>Google</b></span>
      <span class="pill"><b>+2.200</b> avaliações</span>
      <span class="pill"><b>12</b> anos de mercado</span>
      <span class="pill"><b>Fábrica própria,</b> envio para todo o Brasil</span>
    </div>
  </header>

  <main class="chat" id="chat" aria-live="polite"></main>

  <footer class="dock">
    <div class="dock-inner" id="dock"></div>
    <div class="legal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg><span>Sem spam. Ao continuar, você concorda com a <a href="https://gobanners.com.br/politica-de-privacidade/" target="_blank" rel="noopener">Política de Privacidade</a>.</span></div>
  </footer>
</div>

<script>
/* =====================================================================
   GoBanners · Chat de orçamento
   Roteiro inicial (22/11/2026): o mesmo do formulário que o site usava, para colocar o chat no ar.
   As perguntas são revistas com a equipe e trocadas aqui, na lista PASSOS.
   Regras fixas:
   · quem aparece (nome e foto) é o vendedor da vez no rodízio, do começo ao fim; não existe anfitrião;
   · a única troca é a do cliente que já está na base com outro vendedor;
   · cada resposta é gravada na hora (quem abandona aparece no painel com o passo em que parou);
   · fora do expediente o chat avisa, já na abertura, quando a equipe retorna.
   Texto para o cliente: tom profissional, abertura com "Oi", uma pergunta por mensagem, sem "a gente".
   ===================================================================== */
(function () {
  'use strict';
  var FUNCS = 'https://shwjsxqfrogieqojarxr.supabase.co/functions/v1';

    var texto = 'Oi' + (V.nome ? ', ' + V.nome : '') + '! Sou ' + L.nome + (L.empresa ? ', da empresa ' + L.empresa : '') + '. Acabei de pedir um orçamento' + (L.produto_nome && L.produto_id !== 'outro' ? ' de ' + L.produto_nome : '') + ' pelo site.';
    var fimRow = document.createElement('div'); fimRow.className = 'row bot quick fim';

    try { if (window.parent !== window) window.parent.postMessage({ gobanners: 'lead', produto: L.produto_nome || '' }, '*'); } catch (e) { /* fora de iframe */ }
  }
